[project]
name = "ab-testing-dagster"
version = "0.1.0"
description = "A/B testing pipeline orchestrated with Dagster, dbt, and DuckDB"
requires-python = ">=3.10"
dependencies = [
    "dagster~=1.13.15",
    "dagster-webserver~=1.13.15",
    "dagster-dbt~=0.29.15",
    "dbt-duckdb~=1.10.1",
    "duckdb~=1.5.5",
    "pandas~=3.0.5",
    "numpy~=2.5.1",
    "scipy~=1.18.0",
]

[project.optional-dependencies]
dev = ["pytest~=9.1"]
postgres = ["dbt-postgres~=1.10", "psycopg2-binary~=2.9"]

[tool.setuptools.packages.find]
include = ["ab_testing_dagster*"]

[tool.dagster]
module_name = "ab_testing_dagster.definitions"
code_location_name = "ab_testing_dagster"

[tool.pytest.ini_options]
testpaths = ["tests"]
