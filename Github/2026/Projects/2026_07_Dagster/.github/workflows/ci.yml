name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet uv
          uv venv
          uv pip install -e ".[dev]"

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest -q

      - name: Dagster materialize smoke test
        run: |
          source .venv/bin/activate
          python -c "
          import os
          os.environ['PATH'] = os.path.abspath('.venv/bin') + ':' + os.environ['PATH']
          from dagster import materialize
          from ab_testing_dagster.assets import raw_experiment_events, daily_partitions, my_dbt_assets, ab_test_summary_metrics
          from ab_testing_dagster.analytics import ab_test_revenue_metrics, ab_test_segment_metrics, ab_test_sequential_metrics
          from dagster_dbt import DbtCliResource
          from ab_testing_dagster.assets import dbt_project

          keys = daily_partitions.get_partition_keys()[:3]
          for k in keys:
              r = materialize([raw_experiment_events], partition_key=k)
              assert r.success, f'Ingestion failed on {k}'

          r = materialize(
              [my_dbt_assets, ab_test_summary_metrics, ab_test_revenue_metrics, ab_test_segment_metrics, ab_test_sequential_metrics],
              resources={'dbt': DbtCliResource(project_dir=dbt_project)},
          )
          assert r.success, 'Full pipeline failed'
          print('Smoke test passed')
          "
