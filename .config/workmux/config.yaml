worktree_dir: .worktrees
window_prefix: wm-
files:
  copy:
  - .env
  - .env.local
  symlink:
  - node_modules
  - .venv
  - target
post_create:
- git status --short
panes:
- command: 'nvim .'
  focus: true
- command: 'WT="${WM_HANDLE:-$(basename "$PWD")}"; agy -i "$WT"'
  split: horizontal
  focus: false
- command: 'command -v lg >/dev/null 2>&1 && lg -p . || lazygit -p .'
  split: vertical
  focus: false
- command: '(sleep 0.1 && tmux select-layout tiled 2>/dev/null &); WT="${WM_HANDLE:-$(basename "$PWD")}"; command -v qodercli >/dev/null 2>&1 && qodercli -i "$WT" || qoder -i "$WT"'
  split: vertical
  focus: false
nerdfont: true
