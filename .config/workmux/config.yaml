agent: agy
status_tracking: false
status_format: false
confirm_unmerged_removal: false
worktree_dir: .worktrees
window_prefix: wm-
files:
  copy:
  - .env
  - .env.local
  symlink:
  - node_modules
  - .venv
  - target
post_create:
- git status --short
panes:
- command: 'agy --dangerously-skip-permissions'
  focus: true
nerdfont: true

sidebar:
  position: left
  width: 50
  layout: tiles
  dim_stale: true

dashboard:
  sort_mode: priority
  preview_size: 50
  agent_columns: [number, project, worktree, git, pr, status, time, title]
  close_on_jump: true
