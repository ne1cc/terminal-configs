status_tracking: false
worktree_dir: .worktrees
window_prefix: wm-
files:
  copy:
  - .env
  - .env.local
  symlink:
  - node_modules
  - .venv
  - target
post_create:
- git status --short
panes:
- command: 'WT="${WM_HANDLE:-$(basename "$PWD")}"; agyy -i "$WT"'
  focus: true
- command: 'command -v lg >/dev/null 2>&1 && lg -p . || lazygit -p .'
  split: horizontal
  focus: false
- command: 'WT="${WM_HANDLE:-$(basename "$PWD")}"; command -v qodercli >/dev/null 2>&1 && qodercli -i "$WT" || qoder -i "$WT"'
  split: vertical
  focus: false
nerdfont: true

sidebar:
  position: left
  width: 50
  layout: tiles
  dim_stale: true

dashboard:
  sort_mode: priority
  preview_size: 50
  agent_columns: [number, project, worktree, git, pr, status, time, title]
  close_on_jump: true
