#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# parent hidden, file list just wide enough for names, preview gets the rest
ratio          = [ 0, 1, 4 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size = 2
# Your framebuffer is 6400x3600 (3200x1800 @2x). These are a hard ceiling on how
# many pixels a preview may use, so anything lower shrinks images on this screen.
max_width     = 6400
max_height    = 3600
image_delay   = 30
# "triangle" (bilinear) is the cheapest filter that still looks smooth when
# scaling up, which is the direction we now scale most often.
image_filter  = "triangle"
image_quality = 80

# Yazi's built-in image previewer only downscales, so images smaller than the
# pane render at native size. fill-preview scales them up to fill it instead.
# Scoped to the formats Yazi decodes natively — avif/heic/jxl and svg keep their
# own previewers, which the `image/*` catch-all below would otherwise shadow.
[[plugin.prepend_previewers]]
mime = "image/{jpeg,png,gif,webp,bmp,tiff}"
run  = "fill-preview"

# The matching preloader is what makes it feel instant: the upscale runs ahead of
# the cursor, so hovering a file is usually just a cache read.
[[plugin.prepend_preloaders]]
mime = "image/{jpeg,png,gif,webp,bmp,tiff}"
run  = "fill-preview"

[opener]
edit = [
	{ run = '${EDITOR:-nvim} %s', desc = "Edit", block = true, for = "unix" },
]
open = [
	{ run = 'open %s', desc = "Open", for = "macos" },
]
