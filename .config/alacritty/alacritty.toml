# ==============================================================================
# ALACRITTY CONFIGURATION — TMUX + VIBRANCY OPTIMIZED
# Managed via GNU Stow / Windows Hardlinks: ~/terminal-configs -> $HOME
# Platform: Windows (DirectWrite GPU / DWM Blur) & Linux (Wayland/X11)
# ==============================================================================

# ==============================================================================
# ENVIRONMENT
# ==============================================================================
[env]
TERM = "alacritty"
COLORTERM = "truecolor"

# ==============================================================================
# WINDOW
# ==============================================================================
[window]

# Full: native OS decorations with titlebar.
decorations = "Full"

# No padding — tmux status bars align flush to screen edges
padding = { x = 0, y = 0 }
dynamic_padding = false

# Launch windowed with default dimensions
startup_mode = "Windowed"
dimensions = { columns = 140, lines = 38 }

# Let tmux own the title; suppress Alacritty's own dynamic title updates
dynamic_title = false

# ---------------------------------------------------------------------------
# Vibrancy / Glass Effect (mirrors Ghostty background-opacity + blur)
#
# opacity: 0.0 = fully transparent, 1.0 = fully opaque. 0.78 ≈ Ghostty's 88%
#   slightly darker for tmux legibility.
# blur: requests the compositor to blur content behind the window.
#   - Wayland (GNOME/KDE): works natively with Mutter/KWin blur plugin.
#   - X11: requires picom with blur-method = "dual_kawase" (see note below).
#   - i3/sway: enable blur in your picom/sway compositor config.
#
# Compositor setup hint for X11/picom:
#   Add to picom.conf:
#     blur-method = "dual_kawase";
#     blur-strength = 8;
#     blur-background = true;
# ---------------------------------------------------------------------------
opacity = 0.88
blur = true


# ==============================================================================
# SCROLLING
# ==============================================================================
[scrolling]
# 10,000 lines scrollback (mirrors Ghostty's scrollback-limit = 10000)
history = 10000
multiplier = 3


# ==============================================================================
# FONT
# ==============================================================================
[font]
normal      = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold        = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic      = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size        = 13.0

# Zero offset ensures seamless border and box-drawing lines in tmux without tearing
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }
builtin_box_drawing = true


# ==============================================================================
# CURSOR
# ==============================================================================
[cursor]
style = { shape = "Block", blinking = "Off" }

# Unfocused window shows a hollow block so you can tell at a glance which
# Alacritty window is active when running multiple instances.
unfocused_hollow = true


# ==============================================================================
# COLORS: Tokyo Night — matches Ghostty + tmux status bar palette
# background = #1a1b26 is the shared anchor color across all three configs.
# ==============================================================================
[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

# dim_foreground is used when the terminal is unfocused
dim_foreground = "#565f89"

[colors.cursor]
text   = "#1a1b26"
cursor = "#c0caf5"

[colors.vi_mode_cursor]
text   = "#1a1b26"
cursor = "#bb9af7"

[colors.selection]
# Subtle translucent-light-gray selection — like the standard OS highlight:
# a soft gray sitting behind the text, low contrast so text stays visible.
# (~30% white blended over the #1a1b26 background; Alacritty selection is
# opaque-only, so this fixed gray mimics that translucent look.)
text       = "CellForeground"
background = "#5b5d68"

[colors.normal]
black   = "#32344a"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#444b6a"
red     = "#ff7a93"
green   = "#b9f27c"
yellow  = "#ff9e64"
blue    = "#7da6ff"
magenta = "#bb9af7"
cyan    = "#0db9d7"
white   = "#acb0d0"

[colors.dim]
black   = "#1d202f"
red     = "#914c54"
green   = "#5a7a29"
yellow  = "#946b2d"
blue    = "#44526b"
magenta = "#5d4a78"
cyan    = "#3b6b73"
white   = "#565f89"


# ==============================================================================
# SHELL / TMUX INTEGRATION
# ==============================================================================
[terminal.shell]
# Launch a brand-new independent tmux session with a friendly timestamp on every window.
# Avoids attaching to background/worktree sessions or multi-client window mirroring.
program = "zsh"
args = ["-l", "-c", "if command -v alacritty-new-session >/dev/null 2>&1; then exec alacritty-new-session; else s=$(date +%Y-%m-%d_%H-%M); exec tmux new-session -s \"$s\"; fi"]


# ==============================================================================
# SELECTION
# ==============================================================================
[selection]
# Copy-on-select — selecting text immediately puts it on the system clipboard
# (mirrors Ghostty's copy-on-select = true). Inside tmux, the tmux mouse
# bindings handle this + the "copied" toast; this covers Shift-bypass selection.
save_to_clipboard = true


# ==============================================================================
# MOUSE
# ==============================================================================
[mouse]
# Hide cursor while typing — mirrors Ghostty's mouse-hide-while-typing = true
hide_when_typing = true

# ==============================================================================
# KEYBOARD BINDINGS — FULL TMUX + TERMINAL CONFIGS PARITY
# ==============================================================================

# Shift+Return — raw escape return for Neovim / Claude / multi-line prompts
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Ctrl+Space — Explicit NUL byte ensuring Tmux prefix is never swallowed
[[keyboard.bindings]]
key = "Space"
mods = "Control"
chars = "\u0000"

# Ctrl+Backspace — delete word backward in shell/CLI
[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017"

# Ctrl+Tab / Ctrl+Shift+Tab — explicit CSI sequences for Tmux pane cycling
# (Mirrors Ghostty keybind = ctrl+tab=esc:[27;5;9~)
[[keyboard.bindings]]
key = "Tab"
mods = "Control"
chars = "\u001B[27;5;9~"

[[keyboard.bindings]]
key = "Tab"
mods = "Control|Shift"
chars = "\u001B[27;6;9~"

# Ctrl+Shift+H / Ctrl+Shift+L — explicit CSI sequences for Tmux window switching
[[keyboard.bindings]]
key = "H"
mods = "Control|Shift"
chars = "\u001B[27;6;72~"

[[keyboard.bindings]]
key = "L"
mods = "Control|Shift"
chars = "\u001B[27;6;76~"

# Alt+Shift+[ / ] — literal ESC { / ESC } so Neovim receives <A-{> / <A-}> (buffer move)
[[keyboard.bindings]]
key = "LBracket"
mods = "Alt|Shift"
chars = "\u001B{"

[[keyboard.bindings]]
key = "RBracket"
mods = "Alt|Shift"
chars = "\u001B}"

# Ctrl+Shift+Left / Ctrl+Shift+Right — move / swap active window position
[[keyboard.bindings]]
key = "Left"
mods = "Control|Shift"
chars = "\u001B[1;6D"

[[keyboard.bindings]]
key = "Right"
mods = "Control|Shift"
chars = "\u001B[1;6C"

# Shift+Left / Shift+Right — previous / next window
[[keyboard.bindings]]
key = "Left"
mods = "Shift"
chars = "\u001B[1;2D"

[[keyboard.bindings]]
key = "Right"
mods = "Shift"
chars = "\u001B[1;2C"

# Ctrl+PageUp / Ctrl+PageDown — previous / next window
[[keyboard.bindings]]
key = "PageUp"
mods = "Control"
chars = "\u001B[5;5~"

[[keyboard.bindings]]
key = "PageDown"
mods = "Control"
chars = "\u001B[6;5~"

# ------------------------------------------------------------------------------
# Ergonomic Tmux Accelerators (Direct trigger without manual Prefix chord)
# ------------------------------------------------------------------------------
# Alt+\ or Alt+D -> Tmux vertical split (side-by-side) [mirrors Ghostty Cmd+D]
[[keyboard.bindings]]
key = "Backslash"
mods = "Alt"
chars = "\u0000|"

[[keyboard.bindings]]
key = "D"
mods = "Alt"
chars = "\u0000|"

# Alt+- or Alt+Shift+D -> Tmux horizontal split (stacked) [mirrors Ghostty Cmd+Shift+D]
[[keyboard.bindings]]
key = "Minus"
mods = "Alt"
chars = "\u0000-"

[[keyboard.bindings]]
key = "D"
mods = "Alt|Shift"
chars = "\u0000-"

# Alt+z -> Tmux toggle zoom (maximize/minimize active pane)
[[keyboard.bindings]]
key = "Z"
mods = "Alt"
chars = "\u0000z"

# Alt+H / Alt+J / Alt+K / Alt+L -> Direct Pane Focus (mirrors Ghostty Cmd+H/J/K/L)
[[keyboard.bindings]]
key = "H"
mods = "Alt"
chars = "\u0000h"

[[keyboard.bindings]]
key = "J"
mods = "Alt"
chars = "\u0000j"

[[keyboard.bindings]]
key = "K"
mods = "Alt"
chars = "\u0000k"

[[keyboard.bindings]]
key = "L"
mods = "Alt"
chars = "\u0000l"

# ------------------------------------------------------------------------------
# Native Terminal Actions (Clipboard, Zoom, Fullscreen)
# ------------------------------------------------------------------------------
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Return"
mods = "Alt"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"
