worktree_dir: .worktrees
window_prefix: wm-
files:
  copy:
  - .env
  - .env.local
  symlink:
  - node_modules
  - .venv
  - target
post_create:
- git status --short
panes:
- command: nvim .
  focus: true
- split: horizontal
  command: agyy
  focus: false
- split: vertical
  command: claude
  focus: false
- split: vertical
  focus: false
nerdfont: true
